name: ACEest CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and syntax validation
        run: python -m py_compile app.py test_app.py
      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .
      - name: Run Pytest inside Docker
        run: docker run --rm aceest-fitness:${{ github.sha }} pytest -q
